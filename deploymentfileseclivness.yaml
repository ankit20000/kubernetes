apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-backend
  template:
    metadata:
      labels:
        app: python-backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: backend
          image: ankit1111/python-backedn
          ports:
            - containerPort: 5000

          livenessProbe:
            httpGet:
              path: /healthapp/app
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
