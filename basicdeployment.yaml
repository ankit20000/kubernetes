apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-backend
  template:
    metadata:
      labels:
        app: python-backend
    spec:
      containers:
      - name: backend
        image: ankit1111/python-backedn
        ports:
        - containerPort: 5000
